<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>HOMIC｜お見積り</title>

  <link
    rel="stylesheet"
    href="contract.css"
  >

</head>


<body>


<main class="contract-page">


  <section class="contract-card">


    <!-- HEADER -->

    <div class="contract-header">

      <p class="contract-label">
        HOMIC WEB PRODUCTION
      </p>

      <h1>
        お見積り
      </h1>

      <p>
        必要事項を入力して、制作内容と料金をご確認ください。
      </p>

    </div>


    <!-- CUSTOMER -->

    <div class="form-section">

      <div class="form-group">

        <label for="customerName">
          お客様名
        </label>

        <input
          type="text"
          id="customerName"
          placeholder="例：山田 太郎"
          autocomplete="name"
        >

      </div>


      <div class="form-group">

        <label for="shopName">
          店舗・会社名
        </label>

        <input
          type="text"
          id="shopName"
          placeholder="例：○○美容室"
        >

      </div>


      <div class="form-group">

        <label for="customerEmail">
          メールアドレス
        </label>

        <input
          type="email"
          id="customerEmail"
          placeholder="example@email.com"
          autocomplete="email"
        >

      </div>

    </div>


    <!-- PLAN -->

    <div class="form-section">

      <h2>
        プランを選択
      </h2>


      <div class="plan-list">


        <label class="plan-option">

          <input
            type="radio"
            name="plan"
            value="10000"
            data-plan="STARTER"
          >

          <span>

            <strong>
              STARTER
            </strong>

            <br>

            シンプルホームページ

            <br>

            <b>
              10,000円〜
            </b>

          </span>

        </label>


        <label class="plan-option">

          <input
            type="radio"
            name="plan"
            value="30000"
            data-plan="STANDARD"
          >

          <span>

            <strong>
              STANDARD
            </strong>

            <br>

            しっかり伝わるホームページ

            <br>

            <b>
              30,000円〜
            </b>

          </span>

        </label>


        <label class="plan-option">

          <input
            type="radio"
            name="plan"
            value="50000"
            data-plan="CUSTOM"
          >

          <span>

            <strong>
              CUSTOM
            </strong>

            <br>

            こだわりホームページ

            <br>

            <b>
              50,000円〜
            </b>

          </span>

        </label>


      </div>

    </div>


    <!-- OPTIONS -->

    <div class="form-section">

      <h2>
        オプション
      </h2>


      <label class="option-row">

        <input
          type="checkbox"
          class="option"
          value="5000"
          data-name="追加ページ"
        >

        <span>
          追加ページ
        </span>

        <strong>
          +5,000円
        </strong>

      </label>


      <label class="option-row">

        <input
          type="checkbox"
          class="option"
          value="10000"
          data-name="予約機能"
        >

        <span>
          予約機能
        </span>

        <strong>
          +10,000円
        </strong>

      </label>


      <label class="option-row">

        <input
          type="checkbox"
          class="option"
          value="10000"
          data-name="お問い合わせフォーム"
        >

        <span>
          お問い合わせフォーム
        </span>

        <strong>
          +10,000円
        </strong>

      </label>


      <label class="option-row">

        <input
          type="checkbox"
          class="option"
          value="5000"
          data-name="SNS連携"
        >

        <span>
          SNS連携
        </span>

        <strong>
          +5,000円
        </strong>

      </label>


      <label class="option-row">

        <input
          type="checkbox"
          class="option"
          value="10000"
          data-name="基本SEO設定"
        >

        <span>
          基本SEO設定
        </span>

        <strong>
          +10,000円
        </strong>

      </label>


    </div>


    <!-- SUMMARY -->

    <div class="price-summary">

      <p class="price-summary-label">
        TOTAL
      </p>

      <p
        id="estimateTotal"
        class="price-summary-total"
      >
        0円
      </p>

    </div>


    <!-- DETAIL -->

    <div class="form-section">

      <h2>
        お見積り内容
      </h2>


      <p>
        プラン：
        <strong id="selectedPlan">
          未選択
        </strong>
      </p>


      <p>
        オプション：
      </p>

      <div id="selectedOptions">
        なし
      </div>


      <hr>


      <p>
        総支払額：
      </p>

      <strong
        id="summaryTotal"
        style="font-size: 28px;"
      >
        0円
      </strong>


    </div>


    <!-- AGREEMENT -->

    <div class="agreement-area">

      <label class="agreement-check">

        <input
          type="checkbox"
          id="estimateAgree"
        >

        <span>
          お見積り内容・総支払額を確認しました。
        </span>

      </label>


      <button
        type="button"
        id="estimateButton"
        class="contract-button"
        disabled
      >
        見積を確定して契約へ →
      </button>

    </div>


    <p class="contract-note">

      ※確定後、契約内容の確認ページへ進みます。

    </p>


  </section>


</main>


<script src="contract.js"></script>


</body>

</html>
