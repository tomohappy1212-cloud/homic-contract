<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMIC｜お見積もり</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

<a href="index.html" class="logo">
HOMIC<span>.</span>
</a>

<div class="header-sub">
ESTIMATE
</div>

</header>


<main class="form-page">

<div class="form-container">


<div class="page-heading">

<div class="section-label">
STEP 01 / ESTIMATE
</div>

<h1>お見積もり</h1>

<p>
制作内容を選択すると、
総支払額が自動で計算されます。
</p>

</div>


<section class="form-card">

<h2>お客様情報</h2>

<label>
お名前

<input
type="text"
id="customerName"
placeholder="山田 太郎"
>
</label>


<label>
メールアドレス

<input
type="email"
id="customerEmail"
placeholder="example@email.com"
>
</label>


<label>
店舗・会社名

<input
type="text"
id="shopName"
placeholder="〇〇美容室"
>
</label>

</section>


<section class="form-card">

<h2>制作プラン</h2>


<label class="select-card">

<input
type="radio"
name="plan"
value="10000"
data-name="STARTER"
checked
>

<div>

<strong>STARTER</strong>

<span>
1ページのシンプルなホームページ
</span>

</div>

<b>10,000円</b>

</label>


<label class="select-card">

<input
type="radio"
name="plan"
value="30000"
data-name="STANDARD"
>

<div>

<strong>STANDARD</strong>

<span>
3〜5ページのホームページ
</span>

</div>

<b>30,000円</b>

</label>


<label class="select-card">

<input
type="radio"
name="plan"
value="50000"
data-name="CUSTOM"
>

<div>

<strong>CUSTOM</strong>

<span>
こだわりのオリジナル制作
</span>

</div>

<b>50,000円</b>

</label>

</section>


<section class="form-card">

<h2>追加オプション</h2>


<label class="check-card">

<input
type="checkbox"
value="5000"
data-name="ページ追加"
>

<span>ページ追加</span>

<b>+5,000円</b>

</label>


<label class="check-card">

<input
type="checkbox"
value="5000"
data-name="予約・問い合わせ機能"
>

<span>予約・問い合わせ機能</span>

<b>+5,000円</b>

</label>


<label class="check-card">

<input
type="checkbox"
value="5000"
data-name="基本SEO設定"
>

<span>基本SEO設定</span>

<b>+5,000円</b>

</label>


<label class="check-card">

<input
type="checkbox"
value="10000"
data-name="特殊機能"
>

<span>特殊機能</span>

<b>+10,000円</b>

</label>

</section>


<section class="total-card">

<p>TOTAL</p>

<strong id="total">
10,000円
</strong>

<span>
今回のお見積もり総額
</span>

</section>


<button
type="button"
id="createEstimate"
class="main-button"
>
この内容で見積もりを作成 →
</button>


</div>

</main>


<script>

const STORAGE_KEY = "homicEstimate";


function calculateTotal(){

let price = 0;

const plan =
document.querySelector(
'input[name="plan"]:checked'
);

if(plan){
price += Number(plan.value);
}

document
.querySelectorAll(
'.check-card input:checked'
)
.forEach(item => {

price += Number(item.value);

});

return price;

}


function displayTotal(){

const total =
calculateTotal();

document.getElementById(
"total"
).textContent =
new Intl.NumberFormat(
"ja-JP"
).format(total) + "円";

}


document
.querySelectorAll(
'input[name="plan"], .check-card input'
)
.forEach(input => {

input.addEventListener(
"change",
displayTotal
);

});


displayTotal();


document
.getElementById("createEstimate")
.addEventListener(
"click",
function(){

const name =
document
.getElementById("customerName")
.value.trim();

const email =
document
.getElementById("customerEmail")
.value.trim();

const shop =
document
.getElementById("shopName")
.value.trim();


if(!name){

alert("お名前を入力してください。");

return;

}


if(!email){

alert("メールアドレスを入力してください。");

return;

}


const plan =
document.querySelector(
'input[name="plan"]:checked'
);


const options = [];

document
.querySelectorAll(
'.check-card input:checked'
)
.forEach(item => {

options.push({
name: item.dataset.name,
price: Number(item.value)
});

});


const total =
calculateTotal();


const contractNumber =
"HOMIC-" +
Date.now()
.toString()
.slice(-8);


const data = {

contractNumber,

customerName: name,

customerEmail: email,

shopName: shop,

plan: plan.dataset.name,

basePrice: Number(plan.value),

options,

total,

createdAt:
new Date().toISOString(),

termsAccepted: false,

contractAccepted: false,

paymentSubmitted: false,

paymentConfirmed: false

};


localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);


window.location.href =
"terms.html";

});

</script>

</body>
</html>
