<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMIC｜契約確認</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

<a href="index.html" class="logo">
HOMIC<span>.</span>
</a>

<div class="header-sub">
CONTRACT
</div>

</header>


<main class="form-page">

<div class="form-container">


<div class="page-heading">

<div class="section-label">
STEP 03 / CONTRACT
</div>

<h1>契約内容の確認</h1>

<p>
以下の内容をご確認ください。
</p>

</div>


<section class="summary-card">

<div class="summary-row">

<span>契約番号</span>

<strong id="contractNumber">
—
</strong>

</div>


<div class="summary-row">

<span>お客様</span>

<strong id="customerName">
—
</strong>

</div>


<div class="summary-row">

<span>店舗・会社</span>

<strong id="shopName">
—
</strong>

</div>


<div class="summary-row">

<span>メール</span>

<strong id="customerEmail">
—
</strong>

</div>


<div class="summary-row">

<span>プラン</span>

<strong id="plan">
—
</strong>

</div>


<div class="summary-row">

<span>基本料金</span>

<strong id="basePrice">
—
</strong>

</div>


<div class="summary-row">

<span>オプション</span>

<strong id="options">
なし
</strong>

</div>


<div class="summary-total">

<span>総支払額</span>

<strong id="total">
—
</strong>

</div>

</section>


<div class="contract-date">

契約日：

<strong id="contractDate">
—
</strong>

</div>


<label class="agreement">

<input
type="checkbox"
id="contractCheck"
>

<span>
上記の契約内容を確認し、
契約内容に同意します。
</span>

</label>


<button
id="contractButton"
class="main-button"
disabled
>
契約を確定する →
</button>


</div>

</main>


<script>

const STORAGE_KEY =
"homicEstimate";


const data =
JSON.parse(
localStorage.getItem(STORAGE_KEY) || "null"
);


if(!data){

alert(
"先にお見積もりを作成してください。"
);

window.location.href =
"estimate.html";

}


if(!data.termsAccepted){

alert(
"先に利用規約への同意が必要です。"
);

window.location.href =
"terms.html";

}


function money(value){

return new Intl.NumberFormat(
"ja-JP"
).format(value) + "円";

}


document.getElementById(
"contractNumber"
).textContent =
data.contractNumber;


document.getElementById(
"customerName"
).textContent =
data.customerName;


document.getElementById(
"shopName"
).textContent =
data.shopName || "—";


document.getElementById(
"customerEmail"
).textContent =
data.customerEmail;


document.getElementById(
"plan"
).textContent =
data.plan;


document.getElementById(
"basePrice"
).textContent =
money(data.basePrice);


document.getElementById(
"options"
).textContent =

data.options.length
? data.options
.map(item => item.name)
.join("・")
: "なし";


document.getElementById(
"total"
).textContent =
money(data.total);


const today =
new Date();


document.getElementById(
"contractDate"
).textContent =

today.getFullYear() +
"年" +

(today.getMonth() + 1) +
"月" +

today.getDate() +
"日";


const check =
document.getElementById(
"contractCheck"
);


const button =
document.getElementById(
"contractButton"
);


check.addEventListener(
"change",
function(){

button.disabled =
!this.checked;

});


button.addEventListener(
"click",
function(){

data.contractAccepted =
true;

data.contractAcceptedAt =
new Date().toISOString();

data.contractDate =
today.toISOString();


localStorage.setItem(
STORAGE_KEY,
JSON.stringify(data)
);


window.location.href =
"payment.html";

});

</script>

</body>
</html>
