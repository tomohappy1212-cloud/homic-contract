<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HOMIC｜受付完了</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<main class="complete-page">

<div class="complete-box">


<div class="complete-check">
✓
</div>


<div class="section-label">
HOMIC WEB PRODUCTION
</div>


<h1>
受付完了
</h1>


<p class="complete-message">
お支払いの申告を受け付けました。
</p>


<div class="complete-status">

<span>STATUS</span>

<strong>
入金確認待ち
</strong>

</div>


<div class="complete-price">

<span>
今回のお支払い
</span>

<strong id="total">
0円
</strong>

</div>


<div class="complete-info">

<p>

契約番号

<strong id="contractNumber">
—
</strong>

</p>


<p>

お客様

<strong id="customerName">
—
</strong>

</p>

</div>


<div class="next-flow">

<h2>
この後の流れ
</h2>

<div>
01　HOMICが入金を確認
</div>

<div>
02　確認メールを送信
</div>

<div>
03　ホームページ制作開始
</div>

</div>


<p class="complete-note">

支払い完了画面のスクリーンショットは、
確認完了まで保存してください。

</p>


</div>

</main>


<script>

const STORAGE_KEY =
"homicEstimate";


const data =
JSON.parse(
localStorage.getItem(STORAGE_KEY) || "null"
);


if(data){

document.getElementById(
"total"
).textContent =

new Intl.NumberFormat(
"ja-JP"
).format(data.total)
+ "円";


document.getElementById(
"contractNumber"
).textContent =
data.contractNumber;


document.getElementById(
"customerName"
).textContent =
data.customerName;

}

</script>

</body>
</html>
