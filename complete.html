<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>HOMIC｜完了</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f7f7f5;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans JP",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}


/* =========================
   PAGE
========================= */

.page {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 24px;

}


/* =========================
   CARD
========================= */

.card {

  width: 100%;

  max-width: 520px;

  background: #fff;

  padding: 45px 30px;

  border-radius: 18px;

  text-align: center;

  box-shadow:
    0 10px 35px
    rgba(0,0,0,0.06);

}


/* =========================
   CHECK
========================= */

.check {

  width: 64px;

  height: 64px;

  margin: 0 auto 24px;

  border-radius: 50%;

  background: #71372d;

  color: #fff;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 32px;

  font-weight: 900;

}


/* =========================
   TITLE
========================= */

.brand {

  margin: 0 0 8px;

  font-size: 11px;

  font-weight: 800;

  letter-spacing: 0.2em;

  color: #71372d;

}


h1 {

  margin: 0;

  font-size: 36px;

  line-height: 1.3;

}


.message {

  margin: 18px 0 0;

  color: #666;

  font-size: 14px;

  line-height: 1.8;

}


/* =========================
   STATUS
========================= */

.status {

  margin-top: 30px;

  padding: 18px;

  border-radius: 10px;

  background: #f1ebe8;

}


.status-title {

  margin: 0;

  font-size: 11px;

  color: #777;

}


.status-text {

  margin: 4px 0 0;

  font-size: 20px;

  font-weight: 900;

  color: #71372d;

}


/* =========================
   INFO
========================= */

.info {

  margin-top: 18px;

  border-top: 1px solid #eee;

}


.row {

  display: flex;

  justify-content: space-between;

  align-items: center;

  padding: 16px 4px;

  border-bottom: 1px solid #eee;

  font-size: 14px;

}


.row span {

  color: #777;

}


.row strong {

  color: #222;

  text-align: right;

}


/* =========================
   NEXT
========================= */

.next {

  margin-top: 25px;

  text-align: left;

}


.next h2 {

  margin: 0 0 10px;

  font-size: 16px;

}


.next p {

  margin: 7px 0;

  color: #666;

  font-size: 13px;

  line-height: 1.7;

}


/* =========================
   NOTE
========================= */

.note {

  margin: 25px 0 0;

  padding-top: 20px;

  border-top: 1px solid #eee;

  color: #888;

  font-size: 11px;

  line-height: 1.7;

}


@media (max-width: 480px) {

  .page {
    padding: 14px;
  }

  .card {
    padding: 38px 20px;
  }

  h1 {
    font-size: 31px;
  }

  .row {
    font-size: 13px;
  }

}

</style>

</head>


<body>


<div class="page">


  <main class="card">


    <div class="check">
      ✓
    </div>


    <p class="brand">
      HOMIC WEB PRODUCTION
    </p>


    <h1>
      受付完了
    </h1>


    <p class="message">

      お支払いの申告を受け付けました。<br>

      HOMIC側で入金確認を行います。

    </p>


    <!-- STATUS -->

    <div class="status">

      <p class="status-title">
        現在のステータス
      </p>

      <p class="status-text">
        入金確認待ち
      </p>

    </div>


    <!-- INFO -->

    <div class="info">


      <div class="row">

        <span>
          契約番号
        </span>

        <strong id="contractNumber">
          —
        </strong>

      </div>


      <div class="row">

        <span>
          お客様名
        </span>

        <strong id="customerName">
          —
        </strong>

      </div>


      <div class="row">

        <span>
          お支払い金額
        </span>

        <strong id="paymentTotal">
          —
        </strong>

      </div>


    </div>


    <!-- NEXT -->

    <div class="next">

      <h2>
        この後について
      </h2>

      <p>
        ① HOMICが入金を確認します。
      </p>

      <p>
        ② 入金確認後、登録されたメールアドレスへ
        確認メールをお送りします。
      </p>

      <p>
        ③ 入金確認後、ホームページ制作を開始します。
      </p>

    </div>


    <p class="note">

      支払い完了画面のスクリーンショットは、
      確認が完了するまで保存してください。

    </p>


  </main>


</div>


<script>

document.addEventListener(
  "DOMContentLoaded",
  () => {


    const saved =
      localStorage.getItem(
        "homicEstimate"
      );


    if (!saved) {

      document.getElementById(
        "contractNumber"
      ).textContent = "—";

      return;

    }


    let data;


    try {

      data =
        JSON.parse(saved);

    } catch {

      return;

    }


    document.getElementById(
      "contractNumber"
    ).textContent =
      data.contractNumber || "—";


    document.getElementById(
      "customerName"
    ).textContent =
      data.customerName || "—";


    document.getElementById(
      "paymentTotal"
    ).textContent =
      new Intl.NumberFormat(
        "ja-JP"
      ).format(
        Number(
          data.total || 0
        )
      ) + "円";


  }
);

</script>


</body>

</html>
